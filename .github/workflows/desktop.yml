name: SAGE desktop installers
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/local-service/**"
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/desktop.yml"
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sage/desktop test:packaging
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux webview build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: pnpm --filter @sage/desktop assemble
      - run: node apps/desktop/scripts/smoke.mjs
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: pnpm --filter @sage/desktop exec tauri build --ci --bundles ${{ runner.os == 'Windows' && 'nsis' || runner.os == 'Linux' && 'appimage' || 'app,dmg' }}
      - name: Installer checksums
        run: node apps/desktop/scripts/checksums.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sage-desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
